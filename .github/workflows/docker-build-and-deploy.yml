name: Build (Docker) and Deploy to Vercel

on:
  push:
    branches: [ main ]

jobs:
  docker-build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build -t med-lamari-portfolio:latest artifacts/med-lamari-portfolio
          docker create --name builder med-lamari-portfolio:latest
          docker cp builder:/app/dist ./artifacts/med-lamari-portfolio/dist-from-docker
          docker rm builder

      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v20
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: "--prod"
          working-directory: artifacts/med-lamari-portfolio/dist-from-docker
